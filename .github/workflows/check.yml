# 供应链安全：本文件所有 actions 均固定到 commit SHA，SHA 后的注释为对应版本 tag。
# 未启用 dependabot，升级时需手动更新 SHA 与注释。
# Security: all actions are pinned to commit SHAs; the trailing comment is the version tag.
# Dependabot is not enabled - update the SHA and comment manually when upgrading.

name: check

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/check.yml"
      - "assets/**"
      - "**.py"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/check.yml"
      - "assets/**"
      - "**.py"
  workflow_dispatch:

jobs:
  resource:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Use Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Run maa-checker
        run: |
          npm ci
          # 使用 package-lock.json 锁定的本地版本，避免 npx 从网络拉取非预期版本
          ./node_modules/.bin/maa-tools check

      - name: Install maafw
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate JSON Schema
        run: |
          python -m pip install jsonschema==4.26.0 referencing==0.37.0
          python tools/validate_schema.py --schema-dir deps/tools --resource-dirs assets/resource/pipeline assets/resource_bilibili/pipeline assets/resource_taptap/pipeline --task-dirs assets/resource/tasks --interface-files assets/interface.json
