# Mirror酱为第三方分发服务，新项目默认关闭
# 若有需要请联系 Mirror酱 开通，直接自行开启是无法使用的
# https://mirrorchyan.com/
#
# 供应链安全：本文件 actions 固定到 commit SHA，SHA 后注释为对应版本 tag（未启用 dependabot，需手动更新）。

name: mirrorchyan_release_note

on:
  workflow_dispatch:
    inputs:
      tag:
        default: ''
        required: false
  release:
    types: [edited] # [edited, published]

jobs:
  mirrorchyan:
    runs-on: macos-latest
    # Mirror酱为第三方分发服务，新项目默认关闭
    # 若有需要请联系 Mirror酱 开通，直接自行开启是无法使用的
    # https://mirrorchyan.com/
    if: false
    # if: ${{ github.repository_owner == 'MaaXYZ' }}

    steps:
      - id: uploading
        uses: MirrorChyan/release-note-action@f392b50c411981ee6d33c8ed5e91d66d84d56202 # v1 (branch tip)
        with:
          mirrorchyan_rid: MaaXXX
          version_name: ${{ inputs.tag }}

          owner: MaaXYZ
          repo: MaaXXX
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}
